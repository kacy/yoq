name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: validate-tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: check out workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: resolve tag
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi

          tag_refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          commit=$(printf '%s\n' "$tag_refs" | awk '$2 == "refs/tags/'"$tag"'^{}" {print $1; exit}')
          if [ -z "$commit" ]; then
            commit=$(printf '%s\n' "$tag_refs" | awk '$2 == "refs/tags/'"$tag"'" {print $1; exit}')
          fi
          if [ -z "$commit" ]; then
            echo "release tag does not resolve to a remote tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  fmt-check:
    name: fmt-check
    needs:
      - validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: set up zig
        uses: ./.github/actions/setup-zig
        with:
          cache-prefix: zig-release

      - name: verify formatting
        shell: bash
        run: zig fmt --check src/ tools/ build.zig

      - name: verify source version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          actual=$(sed -n 's/.*pub const string = "\([^"]*\)".*/\1/p' src/lib/version.zig)
          test "$actual" = "$EXPECTED_VERSION"

  build-debug:
    name: build-debug
    needs:
      - validate-tag
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: build-debug
      command: zig build
      ref: ${{ needs.validate-tag.outputs.commit }}
      failure-artifact-name: release-build-debug-log

  docker-build:
    name: docker-build
    needs:
      - validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: build Docker image
        shell: bash
        run: docker build --tag yoq-release:${{ needs.validate-tag.outputs.tag }} .

  examples-validate:
    name: examples-validate
    needs:
      - validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: set up zig
        uses: ./.github/actions/setup-zig
        with:
          cache-prefix: zig-release

      - name: build yoq
        shell: bash
        run: zig build

      - name: validate example manifests
        shell: bash
        run: |
          for manifest in examples/*/manifest.toml; do
            ./zig-out/bin/yoq validate -f "$manifest"
          done

  release-build:
    name: release-build-${{ matrix.arch }}
    needs:
      - validate-tag
      - fmt-check
      - build-debug
      - docker-build
      - examples-validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux
          - arch: arm64
            target: aarch64-linux
          - arch: riscv64
            target: riscv64-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: set up zig
        uses: ./.github/actions/setup-zig
        with:
          cache-prefix: zig-release-${{ matrix.arch }}

      - name: build release binary
        shell: bash
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yoq-release-linux-${{ matrix.arch }}-raw
          path: zig-out/bin/yoq
          retention-days: 7

  package:
    name: package
    needs:
      - validate-tag
      - release-build
    runs-on: ubuntu-latest
    steps:
      - name: download all release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: yoq-release-linux-*-raw
          path: dist/raw

      - name: package release artifacts
        id: package
        shell: bash
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          mkdir -p dist/out
          for dir in dist/raw/yoq-release-linux-*-raw; do
            arch=$(echo "$dir" | sed 's/.*linux-\(.*\)-raw/\1/')
            archive_name="yoq-linux-${arch}-${TAG}.tar.gz"
            checksum_name="yoq-linux-${arch}-${TAG}.sha256"

            chmod +x "${dir}/yoq"
            tar -C "${dir}" -czf "dist/out/${archive_name}" yoq
            (cd dist/out && sha256sum "${archive_name}" > "${checksum_name}")
          done

          RELEASE_TAG="$TAG" RELEASE_VERSION="${{ needs.validate-tag.outputs.version }}" RELEASE_COMMIT="${{ needs.validate-tag.outputs.commit }}" python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path("dist/out")
          artifacts = []
          for archive in sorted(output.glob("*.tar.gz")):
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              artifacts.append({"name": archive.name, "sha256": digest})

          provenance = {
              "schema": "https://github.com/kacy/yoq/release-provenance/v1",
              "subject": artifacts,
              "buildType": "https://github.com/kacy/yoq/release",
              "invocation": {"tag": os.environ["RELEASE_TAG"], "commit": os.environ["RELEASE_COMMIT"]},
              "metadata": {"version": os.environ["RELEASE_VERSION"], "generatedAt": datetime.now(timezone.utc).isoformat()},
          }
          (output / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")

          sbom = {
              "spdxVersion": "SPDX-2.3",
              "dataLicense": "CC0-1.0",
              "SPDXID": "SPDXRef-DOCUMENT",
              "name": "yoq-" + os.environ["RELEASE_TAG"],
              "documentNamespace": "https://github.com/kacy/yoq/releases/" + os.environ["RELEASE_TAG"],
              "creationInfo": {"created": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "creators": ["Tool: yoq release workflow"]},
              "packages": [{"SPDXID": "SPDXRef-Package-yoq", "name": "yoq", "versionInfo": os.environ["RELEASE_VERSION"], "downloadLocation": "NOASSERTION", "filesAnalyzed": False, "licenseConcluded": "NOASSERTION", "licenseDeclared": "NOASSERTION", "copyrightText": "NOASSERTION"}],
          }
          (output / "sbom.spdx.json").write_text(json.dumps(sbom, indent=2) + "\n")
          PY

          test "$(python3 -c 'import json; d=json.load(open("dist/out/provenance.json")); print(d["invocation"]["tag"])')" = "$TAG"

      - name: upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yoq-release-bundle
          path: dist/out/*
          retention-days: 14

      - name: attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/out/*.tar.gz

  publish-release:
    name: publish-release
    needs:
      - validate-tag
      - package
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: yoq-release-bundle
          path: dist

      - name: publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: yoq ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/provenance.json
            dist/sbom.spdx.json
