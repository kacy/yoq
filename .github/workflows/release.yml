name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: validate-tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: check out workflow repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: resolve tag
        id: tag
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi

          tag_refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          commit=$(printf '%s\n' "$tag_refs" | awk '$2 == "refs/tags/'"$tag"'^{}" {print $1; exit}')
          if [ -z "$commit" ]; then
            commit=$(printf '%s\n' "$tag_refs" | awk '$2 == "refs/tags/'"$tag"'" {print $1; exit}')
          fi
          if [ -z "$commit" ]; then
            echo "release tag does not resolve to a remote tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  fmt-check:
    name: fmt-check
    needs:
      - validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: set up zig
        uses: ./.github/actions/setup-zig
        with:
          cache-prefix: zig-release

      - name: verify formatting
        shell: bash
        run: zig fmt --check src/ tools/ build.zig

      - name: verify source version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          actual=$(sed -n 's/.*pub const string = "\([^"]*\)".*/\1/p' src/lib/version.zig)
          test "$actual" = "$EXPECTED_VERSION"

  build-debug:
    name: build-debug
    needs:
      - validate-tag
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: build-debug
      command: zig build
      ref: ${{ needs.validate-tag.outputs.commit }}
      failure-artifact-name: release-build-debug-log

  unit-tests:
    needs: validate-tag
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: release-unit-tests
      command: YOQ_SKIP_SLOW_TESTS=1 zig build test
      ref: ${{ needs.validate-tag.outputs.commit }}
      timeout-minutes: 30
      failure-artifact-name: release-unit-tests-log

  dependency-security:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}
      - name: check dependencies and panic paths
        run: python3 tools/security_gate.py && bash tools/panic_audit.sh

  docker-build:
    name: docker-build
    needs:
      - validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: build Docker image
        shell: bash
        run: docker build --tag yoq-release:${{ needs.validate-tag.outputs.tag }} .

  examples-validate:
    name: examples-validate
    needs:
      - validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: set up zig
        uses: ./.github/actions/setup-zig
        with:
          cache-prefix: zig-release

      - name: build yoq
        shell: bash
        run: zig build

      - name: validate example manifests
        shell: bash
        run: |
          for manifest in examples/*/manifest.toml; do
            ./zig-out/bin/yoq validate -f "$manifest"
          done

  interoperability:
    needs: validate-tag
    uses: ./.github/workflows/_interoperability.yml
    with:
      ref: ${{ needs.validate-tag.outputs.commit }}

  release-build:
    name: release-build-${{ matrix.arch }}
    needs:
      - validate-tag
      - fmt-check
      - build-debug
      - unit-tests
      - dependency-security
      - docker-build
      - examples-validate
      - interoperability
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-linux
          - arch: arm64
            target: aarch64-linux
          - arch: riscv64
            target: riscv64-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: set up zig
        uses: ./.github/actions/setup-zig
        with:
          cache-prefix: zig-release-${{ matrix.arch }}

      - name: build release binary
        shell: bash
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yoq-release-linux-${{ matrix.arch }}-raw
          path: zig-out/bin/yoq
          retention-days: 7

  package:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: package
    needs:
      - validate-tag
      - release-build
    runs-on: ubuntu-latest
    steps:
      - name: check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: download all release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yoq-release-linux-*-raw
          path: dist/raw

      - name: package release artifacts
        id: package
        shell: bash
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          mkdir -p dist/out
          for dir in dist/raw/yoq-release-linux-*-raw; do
            arch=$(echo "$dir" | sed 's/.*linux-\(.*\)-raw/\1/')
            archive_name="yoq-linux-${arch}-${TAG}.tar.gz"
            checksum_name="yoq-linux-${arch}-${TAG}.sha256"

            chmod +x "${dir}/yoq"
            tar -C "${dir}" -czf "dist/out/${archive_name}" yoq
            (cd dist/out && sha256sum "${archive_name}" > "${checksum_name}")
          done

          python3 tools/release_metadata.py --output dist/out --tag "$TAG" \
            --commit "${{ needs.validate-tag.outputs.commit }}" \
            --run "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yoq-release-bundle
          path: dist/out/*
          retention-days: 14

      - name: attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/out/*.tar.gz
            dist/out/provenance.json
            dist/out/sbom.spdx.json

  publish-release:
    permissions:
      contents: write
    name: publish-release
    needs:
      - validate-tag
      - package
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit }}

      - name: download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yoq-release-bundle
          path: dist

      - name: publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: yoq ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/provenance.json
            dist/sbom.spdx.json
