name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: changed-files
    runs-on: ubuntu-latest
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
      bpf: ${{ steps.filter.outputs.bpf }}
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: detect changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            non_docs:
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'scripts/**'
              - 'bpf/**'
              - 'examples/**'
              - 'infra/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'Dockerfile'
              - 'Makefile'
              - '.github/**'
            bpf:
              - 'bpf/**'
              - 'tools/bpf_gen.zig'
              - 'src/test_bpf_load_balancer.zig'
              - 'src/test_bpf_packets.zig'
              - 'tests/bpf/**'
              - 'scripts/bpf-host-tests.sh'
              - 'scripts/bpf-load-balancer-smoke.sh'
              - 'scripts/tc-policy-smoke.sh'
              - 'src/test_tc_policy_chain.zig'
              - 'src/network/ebpf/**'
              - 'src/network/bpf/**'

  storage-write-fault:
    name: storage-write-fault
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-zig
      - name: preserve stored bytes after a failed replacement
        run: bash scripts/storage-write-fault.sh

  veth-namespace:
    name: veth-namespace
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-zig
      - name: verify veth creation in destination namespaces
        run: bash scripts/veth-namespace-smoke.sh

  service-gateway:
    name: service-gateway
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-zig
      - name: verify service vip traffic through container gateways
        run: bash scripts/service-gateway-smoke.sh

  published-ports:
    name: published-ports
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-zig
      - name: install network fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iptables curl
      - name: verify published service ports across replicas
        run: bash scripts/published-ports-smoke.sh

  dns-cache-kernel:
    name: dns-cache-kernel
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-zig
      - name: verify kernel dns cache questions
        run: bash scripts/dns-cache-kernel-smoke.sh

  policy-generation-kernel:
    name: policy-generation-kernel
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-zig
      - name: verify prepared policy generation replacement
        run: bash scripts/policy-generation-smoke.sh

  fmt-check:
    name: fmt-check
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up zig
        uses: ./.github/actions/setup-zig

      - name: verify formatting
        shell: bash
        run: zig fmt --check src/ tools/ build.zig

  build-debug:
    name: build-debug
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: build-debug
      command: zig build
      failure-artifact-name: build-debug-log

  docker-build:
    name: docker-build
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: build Docker image
        shell: bash
        run: docker build --tag yoq-ci:${{ github.sha }} .

  unit-tests:
    name: unit-tests
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: unit-tests
      command: YOQ_SKIP_SLOW_TESTS=1 zig build test -Doptimize=ReleaseSafe
      timeout-minutes: 30
      failure-artifact-name: unit-tests-log

  namespace-stack:
    name: namespace-stack
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: namespace-stack
      command: bash tools/namespace_stack_smoke.sh
      timeout-minutes: 10
      failure-artifact-name: namespace-stack-log

  standard-devices:
    name: standard-devices
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: standard-devices
      command: bash tools/standard_devices_smoke.sh
      timeout-minutes: 10
      failure-artifact-name: standard-devices-log

  installer-contracts:
    name: installer-contracts
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: verify remote installer credentials and cleanup
        run: python3 -m unittest discover -s tests/operator -p 'test_*.py'
      - name: check installer shell syntax
        run: bash -n infra/gcp/install.sh infra/gcp/lib.sh infra/gcp/remote/install-node.sh infra/gcp/remote/install-yoq.sh

  operator-smoke:
    name: operator-smoke
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: operator-smoke
      command: YOQ_SKIP_SLOW_TESTS=1 zig build test-operator -Doptimize=ReleaseSafe
      timeout-minutes: 30
      failure-artifact-name: operator-smoke-log

  network-smoke:
    name: network-smoke
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: network-smoke
      command: YOQ_SKIP_SLOW_TESTS=1 zig build test-network -Doptimize=ReleaseSafe
      timeout-minutes: 30
      failure-artifact-name: network-smoke-log

  runtime-kernel:
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_runtime-test.yml

  hardening-smoke:
    name: hardening-smoke
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: hardening-smoke
      command: bash tools/panic_audit.sh && YOQ_SKIP_SLOW_TESTS=1 zig build test-hardening -Doptimize=ReleaseSafe
      timeout-minutes: 45
      failure-artifact-name: hardening-smoke-log

  bpf-consistency:
    name: bpf-consistency
    needs:
      - changed-files
    if: needs.changed-files.outputs.bpf == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up zig
        uses: ./.github/actions/setup-zig
        with:
          cache-prefix: zig-bpf

      - name: install clang-19
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          sudo apt-get install --yes clang-19
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100

      - name: regenerate checked-in bpf bytecode
        shell: bash
        run: |
          clang-19 --version
          zig build bpf
          zig fmt src/network/bpf/

      - name: verify checked-in bpf artifacts
        shell: bash
        run: |
          git diff -- src/network/bpf > "$RUNNER_TEMP/bpf-diff.patch" || true
          git status --porcelain -- src/network/bpf >> "$RUNNER_TEMP/bpf-diff.patch"
          git diff --exit-code -- src/network/bpf
          if git status --porcelain -- src/network/bpf | grep -q .; then
            git status --porcelain -- src/network/bpf
            exit 1
          fi

      - name: verify bpf helper failures and packet parsing
        run: bash scripts/bpf-host-tests.sh

      - name: verify bpf packet handling with the kernel
        run: bash scripts/bpf-load-balancer-smoke.sh

      - name: verify shared TC policy enforcement with the kernel
        run: bash scripts/tc-policy-smoke.sh

      - name: upload bpf diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bpf-consistency-diff
          path: ${{ runner.temp }}/bpf-diff.patch
          retention-days: 7

  dns-bridge-kernel:
    name: dns-bridge-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: set up zig
        uses: ./.github/actions/setup-zig
      - name: install fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 libsqlite3-dev
      - name: verify bridge-confined dns packets
        run: bash scripts/dns-bridge-kernel-smoke.sh

  examples-validate:
    name: examples-validate
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up zig
        uses: ./.github/actions/setup-zig

      - name: build yoq
        shell: bash
        run: zig build -Doptimize=ReleaseSafe

      - name: validate example manifests
        shell: bash
        run: |
          for manifest in examples/*/manifest.toml; do
            ./zig-out/bin/yoq validate -f "$manifest"
          done

      - name: exercise backup verification and recovery commands
        run: python3 scripts/backup-restore-smoke.py ./zig-out/bin/yoq

  agent-recovery:
    name: agent-recovery
    needs: changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-zig
      - name: install namespace fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iptables wireguard-tools
      - name: build yoq
        run: zig build -Doptimize=ReleaseSafe
      - name: recover a joined agent after leader death and interrupted result delivery
        run: sudo env YOQ_BIN="$PWD/zig-out/bin/yoq" YOQ_SMOKE_DIR="$RUNNER_TEMP/agent-recovery" bash scripts/agent-recovery-smoke.sh
      - name: export fixture logs without credentials
        if: always()
        run: |
          sudo install -d -m 0755 "$RUNNER_TEMP/agent-recovery-logs"
          sudo find "$RUNNER_TEMP/agent-recovery" -maxdepth 1 -type f \( -name '*.log' -o -name result.json \) \
            -exec install -m 0644 -t "$RUNNER_TEMP/agent-recovery-logs" {} +
      - name: retain recovery logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-recovery-logs
          path: |
            ${{ runner.temp }}/agent-recovery-logs/*.log
            ${{ runner.temp }}/agent-recovery-logs/result.json
          retention-days: 7
      - name: retain the fixture executable for local reproduction
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-recovery-binary
          path: zig-out/bin/yoq
          retention-days: 1

  registry-tls:
    name: registry-tls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: set up zig
        uses: ./.github/actions/setup-zig
      - name: verify trusted and rejected registry connections
        run: |
          zig build-exe -lc --dep linux_platform -Mroot=src/test_registry_tls.zig -Mlinux_platform=src/lib/linux_platform.zig -femit-bin=/tmp/yoq-registry-tls-fixture
          sudo python3 tools/test_registry_tls.py --binary /tmp/yoq-registry-tls-fixture

  interoperability:
    uses: ./.github/workflows/_interoperability.yml

  wireguard-kernel:
    name: wireguard-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: set up zig
        uses: ./.github/actions/setup-zig
      - name: install independent kernel reader
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y wireguard-tools
      - name: verify native wireguard configuration
        run: bash scripts/wireguard-kernel-smoke.sh
