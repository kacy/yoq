name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: changed-files
    runs-on: ubuntu-latest
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
      bpf: ${{ steps.filter.outputs.bpf }}
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: detect changed files
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            non_docs:
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'bpf/**'
              - 'examples/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'Dockerfile'
              - 'Makefile'
              - '.github/**'
            bpf:
              - 'bpf/**'
              - 'tools/bpf_gen.zig'
              - 'src/test_bpf_load_balancer.zig'
              - 'scripts/bpf-load-balancer-smoke.sh'
              - 'src/network/bpf/**'

  fmt-check:
    name: fmt-check
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up zig
        uses: ./.github/actions/setup-zig

      - name: verify formatting
        shell: bash
        run: zig fmt --check src/ tools/ build.zig

  build-debug:
    name: build-debug
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: build-debug
      command: zig build
      failure-artifact-name: build-debug-log

  docker-build:
    name: docker-build
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: build Docker image
        shell: bash
        run: docker build --tag yoq-ci:${{ github.sha }} .

  unit-tests:
    name: unit-tests
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: unit-tests
      command: YOQ_SKIP_SLOW_TESTS=1 zig build test -Doptimize=ReleaseSafe
      timeout-minutes: 30
      failure-artifact-name: unit-tests-log

  operator-smoke:
    name: operator-smoke
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: operator-smoke
      command: YOQ_SKIP_SLOW_TESTS=1 zig build test-operator -Doptimize=ReleaseSafe
      timeout-minutes: 30
      failure-artifact-name: operator-smoke-log

  network-smoke:
    name: network-smoke
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: network-smoke
      command: YOQ_SKIP_SLOW_TESTS=1 zig build test-network -Doptimize=ReleaseSafe
      timeout-minutes: 30
      failure-artifact-name: network-smoke-log

  hardening-smoke:
    name: hardening-smoke
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    uses: ./.github/workflows/_build-test.yml
    with:
      job-name: hardening-smoke
      command: bash tools/panic_audit.sh && YOQ_SKIP_SLOW_TESTS=1 zig build test-hardening -Doptimize=ReleaseSafe
      timeout-minutes: 45
      failure-artifact-name: hardening-smoke-log

  bpf-consistency:
    name: bpf-consistency
    needs:
      - changed-files
    if: needs.changed-files.outputs.bpf == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up zig
        uses: ./.github/actions/setup-zig
        with:
          cache-prefix: zig-bpf

      - name: install clang-19
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          sudo apt-get install --yes clang-19
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-19 100

      - name: regenerate checked-in bpf bytecode
        shell: bash
        run: |
          zig build bpf
          zig fmt src/network/bpf/

      - name: verify checked-in bpf artifacts
        shell: bash
        run: |
          git diff -- src/network/bpf > "$RUNNER_TEMP/bpf-diff.patch" || true
          git status --porcelain -- src/network/bpf >> "$RUNNER_TEMP/bpf-diff.patch"
          git diff --exit-code -- src/network/bpf
          if git status --porcelain -- src/network/bpf | grep -q .; then
            git status --porcelain -- src/network/bpf
            exit 1
          fi

      - name: verify load balancer with the kernel
        run: bash scripts/bpf-load-balancer-smoke.sh

      - name: upload bpf diff
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bpf-consistency-diff
          path: ${{ runner.temp }}/bpf-diff.patch
          retention-days: 7

  examples-validate:
    name: examples-validate
    needs:
      - changed-files
    if: needs.changed-files.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up zig
        uses: ./.github/actions/setup-zig

      - name: build yoq
        shell: bash
        run: zig build -Doptimize=ReleaseSafe

      - name: validate example manifests
        shell: bash
        run: |
          for manifest in examples/*/manifest.toml; do
            ./zig-out/bin/yoq validate -f "$manifest"
          done

  tls-interop:
    name: tls-interop
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: set up zig
        uses: ./.github/actions/setup-zig
      - name: exchange application data with openssl
        run: python3 tools/test_tls_interop.py

  image-layer-interop:
    name: image-layer-interop
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: set up zig
        uses: ./.github/actions/setup-zig
      - name: install independent oci unpacker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y umoci
      - name: compare native layers with umoci
        run: |
          zig build-exe -lc --dep linux_platform -Mroot=src/test_image_layers.zig -Mlinux_platform=src/lib/linux_platform.zig -femit-bin=/tmp/yoq-image-layer-fixture
          sudo python3 tools/test_image_layers.py --binary /tmp/yoq-image-layer-fixture
